site_name: RingCentral MCP
site_description: Developer documentation for RingCentral Model Context Protocol (MCP) servers — tool references, integration guides, and quickstarts.
site_author: RingCentral Labs
site_url: https://mcp.labs.ringcentral.com/docs/

edit_uri: ""
docs_dir: docs
hooks:
  - hooks/fix_ringcentral_redirect.py
  - hooks/skill_downloads.py

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ringcentral
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ringcentral

plugins:
  - material-ringcentral:
      labs_project: ringcentral-mcp
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - skills
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Solutions:
    - Overview: solutions/index.md
    - Communication Analytics: solutions/communication-analytics.md
    - Coaching & Insights: solutions/coaching-insights.md
    - Customer Engagement: solutions/customer-engagement.md
    - Team Collaboration: solutions/team-collaboration.md
    - CRM Enrichment: solutions/crm-enrichment.md
  - Skill Library:
    - Overview: skills/index.md
    - Daily Communications Digest: skills/daily-communications-digest.md
    - Send SMS: skills/send-sms.md
    - SMS Inbox: skills/sms-inbox.md
    - Voicemail Inbox: skills/voicemail-inbox.md
    - Fax Inbox: skills/fax-inbox.md
    - Call Recap: skills/call-recap.md
    - Colleague Lookup: skills/colleague-lookup.md
    - Post to Chat: skills/post-to-chat.md
    - Read Team Chat: skills/read-team-chat.md
    - Manage Tasks: skills/manage-tasks.md
  - Servers:
    - Overview: servers/index.md
    - RingEX Phone:
      - Overview: servers/ringex-phone.md
      - Setup: servers/ringex-phone-setup.md
      - Tools: tools/ringex-phone.md
    - RingEX Chat:
      - Overview: servers/ringex-chat.md
      - Setup: servers/ringex-chat-setup.md
      - Tools: tools/ringex-chat.md
    - RingEX Admin:
      - Overview: servers/ringex-admin.md
      - Setup: servers/ringex-admin-setup.md
      - Tools: tools/ringex-admin.md
    - App Connect:
      - Overview: servers/app-connect.md
      - Setup: servers/app-connect-setup.md
      - Tools: tools/app-connect.md
    - Changelog: changelog.md
