site_name: MCP
site_description: Developer documentation for RingCentral Model Context Protocol (MCP) servers — tool references, integration guides, and quickstarts.
site_author: RingCentral Platform Team
site_url: https://mcp.labs.ringcentral.com/

edit_uri: ""
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ringcentral
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ringcentral

plugins:
  - material-ringcentral
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Solutions:
    - Overview: solutions/index.md
    - CRM Enrichment: solutions/crm-enrichment.md
    - Communication Analytics: solutions/communication-analytics.md
    - Coaching & Insights: solutions/coaching-insights.md
    - Customer Engagement: solutions/customer-engagement.md
    - Meetings Intelligence: solutions/meetings-intelligence.md
    - Team Collaboration: solutions/team-collaboration.md
  - Setup:
    - Overview: setup/index.md
    - Claude: setup/claude.md
    - ChatGPT: setup/chatgpt.md
  - Reference:
    - Servers:
      - Overview: servers/index.md
      - RingCentral MCP: servers/rc-labs-mcp.md
      - App Connect: servers/app-connect.md
    - Tool Reference:
      - RingCentral MCP:
        - Overview: tools/ringcentral/index.md
        - gatekeeper_select_tool: tools/ringcentral/gatekeeper-select-tool.md
        - platform_get_capabilities: tools/ringcentral/platform-get-capabilities.md
        - platform_list_get_operations: tools/ringcentral/platform-list-get-operations.md
        - platform_list_post_operations: tools/ringcentral/platform-list-post-operations.md
        - profile_get_current_extension: tools/ringcentral/profile-get-current-extension.md
        - platform_call_get_operation: tools/ringcentral/platform-call-get-operation.md
        - platform_call_post_operation: tools/ringcentral/platform-call-post-operation.md
        - platform_create_glip_conversation_new: tools/ringcentral/platform-create-glip-conversation-new.md
        - platform_create_glip_post_new: tools/ringcentral/platform-create-glip-post-new.md
        - platform_list_glip_chats_new: tools/ringcentral/platform-list-glip-chats-new.md
        - platform_list_glip_conversations_new: tools/ringcentral/platform-list-glip-conversations-new.md
        - platform_list_glip_teams_new: tools/ringcentral/platform-list-glip-teams-new.md
        - platform_read_glip_conversation_new: tools/ringcentral/platform-read-glip-conversation-new.md
        - platform_read_glip_posts_new: tools/ringcentral/platform-read-glip-posts-new.md
        - platform_read_glip_team_new: tools/ringcentral/platform-read-glip-team-new.md
        - platform_list_messages: tools/ringcentral/platform-list-messages.md
        - platform_read_message: tools/ringcentral/platform-read-message.md
        - platform_read_message_content: tools/ringcentral/platform-read-message-content.md
        - platform_read_user_call_log: tools/ringcentral/platform-read-user-call-log.md
        - platform_read_extension: tools/ringcentral/platform-read-extension.md
        - platform_read_unified_presence: tools/ringcentral/platform-read-unified-presence.md
        - platform_read_ai_notes: tools/ringcentral/platform-read-ai-notes.md
        - platform_search_directory_entries: tools/ringcentral/platform-search-directory-entries.md
      - App Connect:
